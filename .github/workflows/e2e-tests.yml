name: E2E Tests (SaaS)

on:
  push:
    branches: [ '**' ]  # Run on all branches
  pull_request:
    branches: [ '**' ]  # Run on internal PRs (skipped for fork PRs - see job `if`)
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

jobs:
  e2e-tests-saas:
    name: E2E Tests on SaaS Environment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Run on:
    #   - push to any branch (except Dependabot)
    #   - manual workflow_dispatch
    #   - pull_request from the same repo (internal PR; Dependabot skipped)
    # Fork pull requests are not run: that required pull_request_target to read
    # secrets, which would execute the fork's code in a privileged job.
    if: >
      (github.event_name == 'push' && github.actor != 'dependabot[bot]') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache: true

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v5
        with:
          version: latest
        env:
          JF_URL: ${{ secrets.PLATFORM_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.PLATFORM_ADMIN_TOKEN }}

      - name: Run E2E tests against SaaS
        run: |
          go test -v -timeout 30m -p 1 ./tests/e2e/... \
            --jfrog.url=${{ secrets.PLATFORM_URL }} \
            --jfrog.adminToken=${{ secrets.PLATFORM_ADMIN_TOKEN }} \
            --jfrog.evidenceToken=${{ secrets.EVIDENCE_USER_TOKEN }} \
            --jfrog.projectToken=${{ secrets.EVIDENCE_PROJECT_TOKEN }} \
            --jfrog.projectKey=${{ secrets.EVIDENCE_PROJECT_KEY }}
        env:
          CI: true
